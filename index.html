<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />

        <title>Frontend Mentor | NFT preview card component</title>

        <!-- Styles -->
        <link rel="stylesheet" href="styles/main.css" />

        <!-- Font  -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <article class="card">
            <img
                src="images/image-equilibrium.jpg"
                alt="Ethereum cube reflecting on the floor"
                class="card__img"
            />

            <h1 class="card__heading">Equilibrium #3429</h1>

            <p class="card__description">
                Our Equilibrium collection promotes balance and calm.
            </p>

            <section class="card__stats">
                <div id="eth-balance">
                    <img src="images/icon-ethereum.svg" alt="Ethereum icon" />
                    <p>0.041 ETH</p>
                </div>

                <div id="remaining-time">
                    <img src="images/icon-clock.svg" alt="Clock icon" />
                    <p>3 days left</p>
                </div>
            </section>

            <hr />

            <section class="card__author">
                <img
                    src="images/image-avatar.png"
                    alt="Author avatar"
                    class="card__author-avatar"
                />
                <p class="card__author-description">
                    Creation of <span id="author-name">Jules Wyvern</span>
                </p>
            </section>
        </article>

        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by
            <a href="https://github.com/diego-joubert">Diego Joubert</a>.
        </footer>
    </body>
</html>
